# Prometheus 配置文件 — 企业员工智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'employee-service'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # 智能客服主应用指标
  - job_name: 'employee-service-app'
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'employee-service'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
