name: Quality Evaluation

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

jobs:
  workflow-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run workflow, retrieval and reliability suites
        run: >-
          python -m pytest -q
          tests/test_full_workflow_evaluator.py
          tests/test_rag_metrics.py
          tests/test_agent_isolation.py
          tests/test_monitoring_feedback.py
          tests/test_memory_fallback.py
